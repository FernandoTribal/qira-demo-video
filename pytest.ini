[pytest]
# Sólo `tests/`. `borradores/` (lo que genera QIRA) NUNCA se colecta: son
# borradores para leer, no casos. `tests_unit` lo comprueba.
testpaths = tests
norecursedirs = borradores .venv reports .git
# Importable (`core`, `screens`…) se invoque como se invoque pytest.
pythonpath = .
python_files = test_*.py
addopts =
    -ra
    --strict-markers
    --alluredir=reports/allure-results
    ; Un caso que sólo pasa al segundo intento NO es verde: es inestable, y
    ; quien acumula lo cuenta aparte (§6.6).
    --reruns 1
    --reruns-delay 5
    --only-rerun WebDriverException
markers =
    humo: lo mínimo para saber si tiene sentido correr lo demás
    efectos: ESCRIBE en el producto; apagado salvo --efectos (§5.5)
    severidad(nivel): blocker | critical | normal | minor | trivial
    func(nombre): la agrupación funcional (Ingreso, Carrito…)
